[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmfao"
version = "0.1.0"
description = "Lightweight Modular Feature-Based Augmentation Operation for video tensors"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
]

[project.scripts]
lmfao = "lmfao.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.8",
]
# Reading/writing real LeRobot datasets (video shards + parquet) needs a video
# codec and a parquet reader; kept optional so the core stays numpy-only.
lerobot = [
    "pyarrow>=14",
    "av>=11",
]
# The miniworld generator ships a complete numpy-only reference backend, so the
# core install needs nothing extra to run it. This optional extra pulls the
# heavy production backend (real 3D Gaussian Splatting) for when the reference
# renderer is swapped out; the pixel-augmentation modules never inherit it.
miniworld = [
    "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
