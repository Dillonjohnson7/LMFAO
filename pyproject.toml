[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmfao"
version = "0.1.0"
description = "Lightweight Modular Feature-Based Augmentation Operation for video tensors"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.8",
]
# The miniworld generator ships a complete numpy-only reference backend, so the
# core install needs nothing extra to run it. This optional extra pulls the
# heavy production backend (real 3D Gaussian Splatting) for when the reference
# renderer is swapped out; the pixel-augmentation modules never inherit it.
miniworld = [
    "torch>=2.1",
]
# LeRobot dataset I/O (the reader/writer and the lmfao-augment CLI). Kept out of
# the core so the pixel-augmentation modules never inherit pyarrow or a video
# codec. pyarrow reads/writes the parquet metadata; PyAV decodes and re-encodes
# the per-camera mp4 video.
datasets = [
    "pyarrow>=15",
    "av>=12",
]

[project.scripts]
lmfao-augment = "lmfao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
