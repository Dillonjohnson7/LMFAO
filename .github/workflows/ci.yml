name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install package
        run: uv pip install --system -e ".[dev,datasets]"

      - name: Ensure LeRobot dataset tests cannot silently skip
        run: python -c "import pyarrow, av"

      - name: Check for conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            exit 1
          fi

      - name: Lint
        run: uv run ruff check src tests

      - name: Byte-compile source
        run: uv run python -m compileall -q src

      - name: Run tests
        run: uv run pytest
