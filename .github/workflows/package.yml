name: Package

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build source and wheel distributions
        run: uv build

      - name: Smoke test wheel install
        run: |
          uv venv /tmp/lmfao-wheel-test
          uv pip install --python /tmp/lmfao-wheel-test/bin/python dist/*.whl
          /tmp/lmfao-wheel-test/bin/python -c "import lmfao; print(lmfao.__all__)"
