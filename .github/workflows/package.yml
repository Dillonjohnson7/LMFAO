name: Package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build distribution
        run: uv build

      - name: Smoke test wheel import
        run: |
          python -m venv /tmp/lmfao-wheel-test
          /tmp/lmfao-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/lmfao-wheel-test/bin/python -c "import lmfao; print(lmfao.__all__)"
