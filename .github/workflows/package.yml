name: Package

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install build

      - name: Build source and wheel distributions
        run: python -m build

      - name: Smoke test wheel install
        run: |
          python -m venv /tmp/lmfao-wheel-test
          /tmp/lmfao-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/lmfao-wheel-test/bin/python -c "import lmfao; print(lmfao.__all__)"

